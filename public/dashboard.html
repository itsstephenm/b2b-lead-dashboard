<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — B2B Leads</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle Navigation">☰</button>
      <div class="brand">B2B <span>Lead</span> Dashboard</div>
    </div>
    <nav class="header-nav">
      <a href="capture-widget.html">← Capture Form</a>
      <button class="btn-export" id="export-btn">📥 Export to CSV</button>
      <button class="btn-logout" id="logout-btn">Sign Out</button>
    </nav>
  </header>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">Menu</div>
      <button class="sidebar-tab active" data-tab="analytics" id="tab-analytics">
        📊 Analytics Dashboard
      </button>
      <button class="sidebar-tab" data-tab="contacts" id="tab-contacts">
        👥 Contacts
      </button>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content Workspace -->
    <main class="main-content">
      <!-- ── View 1: Analytics Dashboard (Active by default) ── -->
      <section id="analytics-view">
        <!-- 7 Compact Summary Metric Tiles -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="label">Total Leads</div>
            <div class="value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="label">New</div>
            <div class="value" id="stat-new">—</div>
          </div>
          <div class="stat-card">
            <div class="label">Contacted</div>
            <div class="value" id="stat-contacted">—</div>
          </div>
          <div class="stat-card">
            <div class="label">Qualified</div>
            <div class="value" id="stat-qualified">—</div>
          </div>
          <div class="stat-card">
            <div class="label">In Progress</div>
            <div class="value" id="stat-inprogress">—</div>
          </div>
          <div class="stat-card">
            <div class="label">Lost</div>
            <div class="value" id="stat-lost">—</div>
          </div>
          <div class="stat-card">
            <div class="label">Attended</div>
            <div class="value" id="stat-attended">—</div>
          </div>
        </div>

        <!-- Leads Table Panel -->
        <div class="panel">
          <div class="panel-header">
            <h2>All Leads</h2>
            <div class="panel-actions">
              <!-- Bulk Action Buttons Container (Hidden by default) -->
              <div id="bulk-actions" class="bulk-actions" style="display: none;">
                <button class="btn-bulk btn-bulk-delete" id="bulk-delete-btn">
                  🗑️ Delete Selected (<span id="bulk-count">0</span>)
                </button>
                <button class="btn-bulk btn-bulk-contact" id="bulk-contact-btn">
                  ✉️ Contact Selected
                </button>
              </div>
              <button class="refresh-btn" id="refresh-btn">⟳ Refresh</button>
            </div>
          </div>

          <!-- Filter and Sort Control Bar directly above table -->
          <div class="table-toolbar">
            <div class="toolbar-item">
              <label for="filter-status">Filter by Status:</label>
              <select id="filter-status" class="toolbar-select">
                <option value="All" selected>All</option>
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="Qualified">Qualified</option>
                <option value="In Progress">In Progress</option>
                <option value="Lost">Lost</option>
                <option value="Attended">Attended</option>
              </select>
            </div>
            <div class="toolbar-item">
              <label for="sort-by">Sort by:</label>
              <select id="sort-by" class="toolbar-select">
                <option value="newest" selected>Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="status">Status (Grouped)</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th style="width: 45px;">#</th>
                  <th style="width: 40px; text-align: center;">
                    <input type="checkbox" id="select-all-checkbox" aria-label="Select All Leads" />
                  </th>
                  <th>Name</th>
                  <th>Company</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Purpose</th>
                  <th>Status</th>
                  <th>Created At</th>
                </tr>
              </thead>
              <tbody id="leads-body">
                <tr class="empty-row">
                  <td colspan="9">Loading leads…</td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- Pagination Control Block -->
          <div class="pagination-container" id="pagination-controls"></div>
        </div>
      </section>

      <!-- ── View 2: Contacts View (SPA Toggle) ── -->
      <section id="contacts-view" style="display: none;">
        <div class="panel">
          <div class="panel-header">
            <h2>Contacts Directory</h2>
            <div id="contacts-filter-badge" style="display: none; align-items: center; gap: 0.5rem;">
              <span class="filter-badge" id="contacts-filter-text">Filtered Contacts</span>
              <button class="btn-clear-filter" id="btn-show-all-contacts">Show All Contacts</button>
            </div>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone Number</th>
                </tr>
              </thead>
              <tbody id="contacts-body">
                <tr class="empty-row">
                  <td colspan="3">Loading contacts…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Custom Context Menu for Name Column -->
  <div id="context-menu" class="context-menu" style="display: none;" role="menu">
    <button class="context-menu-item" id="context-contact-btn" role="menuitem">
      <span>✉️</span> Contact
    </button>
    <button class="context-menu-item context-menu-item-danger" id="context-delete-btn" role="menuitem">
      <span>🗑️</span> Delete
    </button>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
