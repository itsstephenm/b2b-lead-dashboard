<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — B2B Leads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: #0f172a;
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header .brand { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
    header .brand span { color: #60a5fa; }
    header a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    header a:hover { text-decoration: underline; }

    /* ── Main container ─────────────────────────────────────────────────── */
    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* ── Summary cards ──────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .stat-card .label { font-size: 0.78rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #0f172a; margin-top: 0.3rem; }

    /* ── Table panel ────────────────────────────────────────────────────── */
    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .panel-header h2 { font-size: 1.05rem; font-weight: 700; }
    .refresh-btn {
      padding: 0.45rem 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: #1d4ed8; }

    /* ── Table ──────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: #f8fafc; }
    th {
      text-align: left;
      padding: 0.75rem 1.25rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    td {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid #f1f5f9;
      color: #1e293b;
      vertical-align: middle;
    }
    tbody tr:hover { background: #f8fafc; }

    /* ── Status badge ───────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-new        { background: #dbeafe; color: #1d4ed8; }
    .badge-contacted  { background: #fef9c3; color: #854d0e; }
    .badge-qualified  { background: #dcfce7; color: #15803d; }
    .badge-closed     { background: #f0fdf4; color: #166534; }
    .badge-default    { background: #f1f5f9; color: #475569; }

    /* ── Empty / Loading state ──────────────────────────────────────────── */
    .empty-row td {
      text-align: center;
      color: #94a3b8;
      padding: 3rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">B2B <span>Lead</span> Dashboard</div>
    <a href="index.html">← Back to Capture Form</a>
  </header>

  <main>
    <!-- Summary cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Leads</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="label">New</div>
        <div class="value" id="stat-new">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Contacted</div>
        <div class="value" id="stat-contacted">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Qualified</div>
        <div class="value" id="stat-qualified">—</div>
      </div>
    </div>

    <!-- Leads table -->
    <div class="panel">
      <div class="panel-header">
        <h2>All Leads</h2>
        <button class="refresh-btn" id="refresh-btn">⟳ Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Company</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody id="leads-body">
            <tr class="empty-row">
              <td colspan="7">Loading leads…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
