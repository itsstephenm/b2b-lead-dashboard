<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Lead Capture</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
        }

        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-header .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }

        .card-header h1 {
            font-size: 1.75rem;
            color: #0f172a;
            font-weight: 700;
        }

        .card-header p {
            color: #64748b;
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .required {
            color: #ef4444;
            margin-left: 2px;
        }

        input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert.success {
            background: #dcfce7;
            color: #15803d;
            display: block;
        }

        .alert.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }

        .dashboard-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .dashboard-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .dashboard-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <span class="badge">🚀 B2B Platform</span>
            <h1>Get in Touch</h1>
            <p>Fill in your details and our team will reach out shortly.</p>
        </div>

        <form id="lead-form" novalidate>
            <div class="form-group">
                <label for="full_name">Full Name <span class="required">*</span></label>
                <input type="text" id="full_name" name="full_name" placeholder="Jane Smith" required />
            </div>
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company" placeholder="Acme Corp" />
            </div>
            <div class="form-group">
                <label for="email">Work Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="jane@acme.com" required />
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" />
            </div>

            <button type="submit" class="btn" id="submit-btn">Submit →</button>
            <div class="alert" id="alert-msg"></div>
        </form>

        <div class="dashboard-link">
            <a href="index.html">Return to login →</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
